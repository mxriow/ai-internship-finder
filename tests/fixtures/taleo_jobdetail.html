rs are trying to do and using insight to make every digital journey work harder. We’re looking for someone who is commercially curious, confident testing new ideas and able to turn data into improvements customers can genuinely feel.”%3C/strong%3E%3C/span%3E%3C/i%3E%3C/span%3E%3Cspan style=%22color%5C:#999999;%22%3E%3Cspan style=%22mso-spacerun%5C:yes;%22%3E%26nbsp; %3C/span%3EHead of eCommerce Performance, easyJet%3C/span%3E%3C/p%3E%3C/div%3E%3Cp class=%22MsoNormal%22 style=%22margin%5C:15.0pt 0cm 7.0pt;%22%3E%3Cspan style=%22color%5C:#FF6600;font-size%5C:11.0pt;%22%3E%3Cspan style=%22mso-bidi-font-family%5C:Arial;mso-fareast-font-family%5C:Arial;%22%3E%3Cstrong%3EThe team %26amp; culture%3C/strong%3E%3C/span%3E%3C/span%3E%3C/p%3E%3Cp class=%22MsoNormal%22 style=%22margin-bottom%5C:8.0pt;%22%3E%3Cspan style=%22color%5C:#333333;font-size%5C:11.0pt;%22%3E%3Cspan style=%22mso-bidi-font-family%5C:Arial;mso-fareast-font-family%5C:Arial;%22%3EYou’ll work at the centre of eCommerce, partnering closely with Digital Product, UX, development and Commercial teams. It’s a collaborative environment where commercial priorities, customer insight and product delivery come together to improve the booking experience.%3C/span%3E%3C/span%3E%3C/p%3E%3Cp class=%22MsoNormal%22 style=%22margin-bottom%5C:8.0pt;%22%3E%3Cspan style=%22color%5C:#333333;font-size%5C:11.0pt;%22%3E%3Cspan style=%22mso-bidi-font-family%5C:Arial;mso-fareast-font-family%5C:Arial;%22%3EYou’ll be encouraged to ask questions, test assumptions and bring a clear point of view. Success comes from sharing evidence openly, building support for improvements and keeping the customer at the heart of every decision.%3C/span%3E%3C/span%3E%3C/p%3E%3Cp class=%22MsoNormal%22 style=%22margin%5C:15.0pt 0cm 7.0pt;%22%3E%3Cspan style=%22color%5C:#FF6600;font-size%5C:11.0pt;%22%3E%3Cspan style=%22mso-bidi-font-family%5C:Arial;mso-fareast-font-family%5C:Arial;%22%3E%3Cstrong%3EWhat you’ll be doing%3C/strong%3E%3C/span%3E%3C/span%3E%3C/p
