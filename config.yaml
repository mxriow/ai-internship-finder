internship:
  # Title patterns. Word boundaries everywhere, so internal/international/internet never match.
  intern:
    - '\bintern(s|ship|ships)?\b'
    - '\binterne?ship\b'
    - 'praktik(um|ant|antin|anten|ant/in|ant:in|ant\*in|antIn)'   # also compounds: Hochschulpraktikum, Marketingpraktikant
    - '\bstagiair(e|es|s)?\b'                # FR/NL/LU
    - '\bstage\b'
    - '\b(afstudeer|meewerk|snuffel|onderzoeks|eind|marketing|sales|finance|hr|communicatie|business)stage\b'   # NL compounds
    - '\bstage(plaats|plek|vacature|opdracht)\b'
    - '\btirocini(o|ante|anti)\b'
    - '\bstagista\b'
    - '\bsummer (analyst|associate)\b'      # banks' name for summer internships
    - '\boff[- ]cycle\b'
    - '\b(industrial|sandwich|year[- ]long|summer|work) placements?\b'      # UK: placement year = internship
    - '\bplacement (year|student|students|programme|program|scheme)\b'
    - '\bplacement\s*\(\s*\d+\s*(months?|weeks?)\)'
  working_student:
    - '\bworking student\b'
    - '\bwerkstudent(in|en|/in|:in|\*in)?\b'
    - '\bstudent (assistant|job|worker|employee)\b'
    - '\bstudentische (aushilfe|mitarbeit|hilfskraft)\b'
    - '\balternan(ce|t|te)\b'
  trainee:
    - '\btrainees?\b'
    - '\btraineeprogramm(a|e)?\b'
    - '\btraineeships?\b'
  # Graduate / early-career programmes (shown as type "graduate", hidden by default in the viewer).
  graduate:
    - '\bgraduate (programme|program|scheme|trainee|analyst|associate|rotation|consultant|engineer|trader|researcher|software|hardware|quantitative|opportunit|role|position|talent)'
    - '\bgrad(uate)? scheme\b'
    - '\b(new|recent) grad(uate)?s?\b'
    - '\bearly[- ]careers?\b'
    - '\byoung (professionals?|talents?)( program(me)?)?\b'
    - '\b(future|emerging) (leaders?|talents?) program'
    - '\b(leadership development|rotational) program'
    - '\blaunch program\b'
  # A graduate match is cancelled by these (recruiters hiring *for* early careers, etc.).
  not_graduate:
    - '\brecruit(ing|er|ment)?\b'
    - '\b(coordinator|manager|lead|head|director|partner|specialist)\b.*\b(early careers?|campus|graduates?)\b'
  # If a title matches one of these the internship match is cancelled.
  not_internship:
    - '\b(early|late|growth|seed|series [a-e]|multi|first|final|next|clinical)[- ]stage\b'
    - '\bstage (manager|technician|hand|crew|director|gate)\b'
    - '\bbackstage\b'
    - '\bintern(ship)?s? (program(me)?|recruit(ing|ment)?) (manager|coordinator|lead|specialist)\b'
    - '\b(manager|coordinator|head|lead) (of )?(intern(ship)?s|trainees)\b'
    - '\bsales trainee manager\b'
    - '\bstage(begeleider|co[oö]rdinator|bureau)\b'          # NL: internship supervisor / office
  # Structured employment-type values from the feeds that also count.
  employment_types:
    intern: ['\bintern(ship)?s?\b', 'praktikum', '\bstage\b']
    working_student: ['working.?student', 'werkstudent']
    trainee: ['trainee']
    graduate: ['\bgraduate\b', 'new grad', 'early career']

# ---------------------------------------------------------------- function / category
# Checked in order; the first category whose title pattern matches wins, so the
# specific categories (e-commerce, analytics, commercial) come before the generic ones.
categories:
  # hr first: an explicit HR title ("HR Retail", "Employer Branding", "HR Reporting & Campaign Support") is HR
  hr:
    - '\b(hr|human resources?|recruit(ing|ment|er)?|talent (acquisition|management|attraction)|employer branding)\b'
    - 'personal(wesen|abteilung|management|gewinnung)'
    - '\b(personeelszaken|werving)\b'
    - '\bressources humaines\b'
    - '\brisorse umane\b'
    - '\bpeople (&|and) culture\b'
  ecommerce_digital:
    - '\be-?commerce\b'
    - '\b(d2c|dtc|direct[- ]to[- ]consumer)\b'
    - '\b(performance|digital|online|growth|search|affiliate) marketing\b'
    - '\bonline (shop|sales|retail|channels?)\b'
    - '\b(amazon|shopify|marketplaces?|webshop|omni-?channel)\b'
    - '\b(seo|(?-i:SEA)|sem|ppc|paid (media|social|search))\b'
    - '\bdigital (media|channels?|campaigns?|commerce|sales|acquisition)\b'
  marketing_analytics:
    - '\b(consumer|shopper|customer|market) insights?\b'
    - '\b(market|marketing|sales|commercial|customer|pricing|crm|media) (research|intelligence|analytics|analysis|analyst|science)\b'
    - 'marktforschung|marktonderzoek|[ée]tudes? de march[ée]'
  commercial:
    - '\b(trade|customer|shopper|channel) marketing\b'
    - '\bcategory (management|manager|development|planning)\b'
    - '\bkey account'
    - '\baccount management\b'
    - '\bcommercial\b'
    - '\bcommerci[eë]le?\b'
    - '\bcustomer development\b'
    - '\bfield sales\b'
    - '\b(sales force effectiveness|sfe|sales excellence|revenue (growth )?management|rgm)\b'
  brand:
    - '(?<!employer )\bbrand(s|ing)?\b'
    - 'marken(management|führung|kommunikation)'
    - '\b(marque|marchio|merk)\b'
  business_development:
    - '\bbusiness development\b'
    - '\bbiz ?dev\b'
    - '\bpartnerships?\b'
    - 'gesch[aä]ftsentwicklung'
    - 'd[ée]veloppement (commercial|des affaires)'
    - '\bnew business\b'
    - '\bmarket (entry|expansion)\b'
  consulting:
    - '\bconsult(ing|ant|ants|ancy)?\b'
    - '(unternehmens|strategie|management)beratung'
    - '\b(conseil|consulenza|advies)\b'
    - '\badvisory\b'
  strategy:
    - '\bstrat[eé]g(y|ic|ie|ia|isch|ique)\b(?!\s+(purchasing|sourcing|procurement|buying|einkauf|finance))'
    - '\bcorporate development\b'
    - '\btransformation\b'
    - '\bbusiness analyst\b'
  marketing:
    - 'marketing'
    - '\b(social media|crm|influencer|campaigns?|consumer engagement)\b'
    - '^(?!.*(financ|finanz|transfer pricing|verrechnungspreis|tax|steuer|actuar|aktuar|p&c|insurance|versicherung)).*\bpricing\b'   # finance/tax/actuarial pricing -> finance
    - '\bcontent (marketing|creation|creator|manager)\b'
    - '\bmerchandis(ing|er)\b'
    - '\bgo[- ]to[- ]market\b'
    - '\bproduct (marketing|launch)\b'
  communications_pr:
    - '\bcommunications?\b'
    - 'kommunikation'
    - '\bcommunicatie\b'
    - '\bcomunicazione\b'
    - '\b(pr|public relations|public affairs|media relations|press)\b'
    - '\bevents?\b'
    - '\b(editorial|redaktion|journalis[mt])'
    - '\bcorporate affairs\b'
  sales:
    - '\bsales\b'
    - 'vertrieb'
    - '\bverkoop\b'
    - 'verkauf'
    - '\bvente(s)?\b'
    - '\bvendite\b'
    - '\baccount executive\b'
    - '\bclient (advisor|adviser|relations|services?|coverage)\b'
    - '\bkundenberat'
    - '\bretail\b'
    - '\bcustomer success\b'
    - '\binside sales\b'
    - '\bpre-?sales\b'
  finance:
    - '\bfinanc(e|ial)\b'
    - 'finanz'
    - '\b(accounting|accountant|controlling|controller|audit|treasury|tax)\b'
    - '\b(transfer pricing|verrechnungspreise?|actuar(y|ial)|aktuar(iat)?)|(financ|finanz|p&c|insurance).*\bpricing\b'
    - 'buchhaltung|rechnungswesen|steuer'
    - '\b(financi[eë]n|financieel|boekhouding|comptabilit[ée])\b'
    - '\b(funds?|fund (administration|accounting|services|operations)|transfer agency|depositary|custody)\b'
    - '\b(investment|asset|wealth|portfolio|private) (banking|management|equity)\b'
    - '\binvestment\b'
    - '\b(m&a|mergers|corporate finance|equity research|private equity|venture capital|credit|trading|commodit(y|ies)|risk)\b'
    - '\b(banking|wealth|product control)\b'
    - '\bsummer analyst\b'
  operations_supply_chain:
    - '\boperations?\b'
    - '\bsupply chain\b'
    - '\blogisti(k|cs|que|ca)\b'
    - '\b(procurement|purchasing|sourcing|buyer)\b'
    - 'einkauf|beschaffung'
    - '\b(inkoop|logistiek)\b'
    - '\b(achats|acquisti|approvisionnement)\b'
    - '\b(demand|supply|production) planning\b'
    - '\b(project|programme|program) manage'
    - '\bpmo\b'
    - '\bcustomer (service|support|care|operations)\b'
  other_business:
    - '\bbusiness\b'
    - '\bmanagement\b'
    - '\b(administration|administrative|office|assistant|assistenz|executive assistant)\b'
    - 'kaufm[aä]nn|\bkv\b'
    - '\b(bedrijfskunde|bedrijfseconomie)\b'
    - '\b(sustainability|esg|csr|nachhaltigkeit|durabilit[ée]|citizenship|social impact|corporate responsibility)\b'
    - '\b(compliance|governance)\b'
    - '\bproduct manage(r|ment)\b'
    - '\b(analyst|analytics)\b'
    - '\bgeneral\b'
    - '\bbetriebswirtschaft'

# Categories shown by the viewer by default (the others stay one click away).
default_view_categories: [marketing, brand, sales, business_development, strategy, ecommerce_digital, commercial, marketing_analytics, communications_pr]

# Titles naming only an education level (Dutch HBO/WO/MBO "stage") with no clear
# function are sent to review rather than silently filed as other_business.
review_if_generic: ['\b(hbo|wo|mbo)\b']

# Title patterns that put a posting into `excluded` (engineering, IT, data
# science, lab, medical, legal, trades).
# - excluded_hard: always excluded, even if the title also has a business word.
# - excluded_soft: excluded, but if the title ALSO matches a business category
#   (e.g. "Sales Engineer Intern") the posting goes to review instead.
excluded_hard:
  - '\b(software|firmware|embedded|devops|sre|backend|back-end|frontend|front-end|full[- ]?stack|ios|android)\b'
  - '\b(developer|entwickler|développeur|sviluppatore|programmer|programmierer)'
  - '\b(machine learning|deep learning|computer vision|nlp)\b'
  - '\b(ai|ml|data|cloud|qa|test|platform|automation) (software )?engineer'
  - '\b(lab(or)?|laborat|chemist|chemie|chimie|scientist|physic|clinical|klinisch|medical|medizin|pharmacist|apothek|nurse|pflege|physician|doctor|arzt|ärztin|veterinar)'
  - '\b(legal|law|lawyer|counsel|paralegal|jurist|juristin|rechts|juridique|giuridic|attorney|notar)'
  - '\b(electrician|elektriker|mechanic|mechaniker|polymechaniker|technician|techniker|technicien|automatiker|monteur|installateur|carpenter|schreiner|welder|plumber)'
  - '\b(lernende|lernender|lernende/r|lehrstelle|lehre|apprentice|apprenticeship|efz|eba|cfc|afp)\b'
  - '\b(phd|doctoral|postdoc|master thesis|masterarbeit|bachelor thesis|bachelorarbeit|thesis)\b'
  - '(microbiolog|biochemi|biotechnolog|procestechnolog|werktuigbouw|elektrotechni|natuurkunde|scheikunde|laborant|chemie|chemistry)'   # incl. Dutch/German compounds
  - '(analytik\b|bioanaly|pharmazeut|naturwissenschaft|dmpk|toxicolog|pharmacolog|chromatogra|spectromet|drug (disposition|discovery|metabolism|substance|product))'
excluded_soft:
  - '\b(hardware|mobile)\b'
  - 'engineer(ing)?\b'            # also German compounds: Betriebsengineering
  - '\bresearch (studio|labs?|scientists?|engineers?|assistants?)\b'
  - '\b(image|signal|data) processing\b'
  - '\bdata (scien(ce|tist)|engineer)'
  - '\b(ml|ai)\b'
  - '\b(informatik|informatique|informatica|cyber|security|cloud|network|netzwerk|infrastructure|sysadmin|system administrat)'
  - '\b(qa|qc|test(ing|er)?|quality (assurance|control)|qualifizierung|validation)\b'
  - '\b(biolog|biotech|r&d|regulatory affairs)'
  - '\bproduct development\b'
  - '\b(architect|architekt)'
  - '\btechnische?\b'              # NL/DE "technical"; with a business word -> review
excluded_case_sensitive:
  - '\bIT\b'
  - '\bTI\b'

# Description fallback (used when the title has no category signal):
# a category needs at least this many pattern hits in the description,
# and the result is always flagged for review.
description_min_hits: 3

# ---------------------------------------------------------------- language detection
language:
  title_markers:
    nl: ['\(m/v(/[xd])?\)', '\(v/m(/[xd])?\)', '\bstagiair\b', 'afstudeer', 'meewerkstage', '\bstage(plaats|plek)', '\b(voor|bij|het|medewerker)\b']
    de: ['\((m|w|d)/(m|w|d)/(m|w|d)\)', '\bpraktik', '\bwerkstudent', '\b(und|für|im)\b', '(m/w/d)']
    fr: ['\((h|f)/(h|f)\)', '\(f/h/x\)', '\bstagiaire\b', '\b(et|en|de la|des)\b']
    it: ['\btirocini', '\bstagista\b']
  stopwords:
    en: [the, and, you, with, for, our, will, your, are, we, this, have, team]
    de: [und, der, die, das, mit, für, wir, sie, eine, ist, bei, von, ihre, dich, du, auf]
    fr: [et, le, les, des, vous, nous, pour, avec, une, est, dans, votre, sur, au]
    it: [il, di, per, con, che, una, sono, del, della, nostro, nel, gli, ed]
    nl: [het, een, van, jij, wij, voor, zijn, bij, onze, jouw, ook, naar, als, niet, deze, wordt, heb, je]
  min_hits: 5

# ---------------------------------------------------------------- extraction
extract:
  duration:
    - '\b(\d{1,2}(?:\s*[-–]\s*\d{1,2})?)[- ]?(months?|monate?n?|mois|mesi|maanden|maand)\b'
    - '\b(\d{1,2})[- ]?(weeks?|wochen|semaines|settimane|weken)\b'
  # A duration match is ignored when the surrounding text shows it is about something
  # else (benefits, notice period, probation, required experience).
  duration_ignore_after: 'from (the date of )?(your|the) application|after (applying|your application|the interview)|(per|pro|par|a|each|jedes|per)\s+(year|jahr|an|année|anno|jaar)|vacation|ferien|urlaub|holiday|congé|vakantie|experience|erfahrung|expérience|ervaring|esperienza'
  duration_ignore_before: 'assessment|interview|application|apply|recruit|selection|bewerbung|vorstellungsgespr|candidature|sollicitatie|within|innerhalb|remote|telearbeit|home ?office|t[ée]l[ée]travail|thuiswerk|probation|probezeit|notice|kündigung|pr[ée]avis|opzeg|parental|eltern|maternity|paternity|vacation|ferien|urlaub|holiday|experience|erfahrung|expérience|ervaring'
  # Start dates are parsed by finder/dates.py (month names and start words in EN/DE/FR/NL/IT).

# ---------------------------------------------------------------- requirements (degree, languages)
# Applied to the posting description, sentence by sentence and clause by clause
# (clauses are split at , ; : ( ) / and dashes).
requirements:
  # Words that make a mention optional ("a master's is a plus", "German is an advantage").
  optional: '\b(plus|pluspunt|advantage|advantageous|asset|bonus|beneficial|helpful|desirable|preferred|preferably|ideally|nice[- ]to[- ]have|appreciated|optional|would be (great|nice|good))\b|von vorteil|ein plus|wünschenswert|erwünscht|idealerweise|un (plus|atout)|appr[ée]ci[ée]|souhait|serait un|een pr[ée]|mooi meegenomen|gewenst|gradit[oa]|costituisce'
  degree:
    master:
      - '\bmaster(?:[''’]?s)?\s*(degree|program(me)?s?|students?|studies|study|level|course|track|curriculum)\b'
      - '\b(enrolled|enrolment|enrollment|pursuing|studying|currently)\b[^.;]{0,60}\bmaster'
      - '\bmaster (of|in) (science|arts|business|management|finance|economics|marketing)\b'
      - '\b(mba|msc|m\.sc\.?|postgraduate|post-graduate)\b'
      - 'master(studium|student|studentin|studiengang|programm|opleiding|studie)'
      - '\b(wo[- ]master|en master ?[12]?|en m[12]|bac ?\+ ?[45])\b'
    bachelor:
      - '\bbachelor(?:[''’]?s)?\b'
      - '\b(bsc|b\.sc\.?|undergraduate|undergrad|hbo)\b'
      - 'bachelor(studium|student|studentin|studiengang|opleiding)'
      - '\bbac ?\+ ?[23]\b'
    # A bachelor's that is already finished (the role then usually wants a master's student).
    bachelor_completed: '(completed|finished|holding|hold|obtained|already have|abgeschlossen\w*|afgeronde?|behaald|after (your|a|the)|following (your|a))\W+(?:\w+\W+){0,3}bachelor|bachelor\S*\s+(degree\s+)?(completed|abgeschlossen)'
  languages:
    names:
      EN: ['english', 'englisch\w*', 'anglais', 'engels', 'engelse', 'inglese', 'ingl[eé]s']
      DE: ['german', 'deutsch(e|en|er|kenntnisse|sprachig)?', 'schweizerdeutsch', 'allemand', 'duits', 'duitse', 'tedesco']
      FR: ['french', 'franz[öo]sisch\w*', 'fran[cç]ais', 'frans', 'franse', 'francese']
      NL: ['dutch', 'niederl[äa]ndisch\w*', 'n[ée]erlandais', 'nederlands', 'nederlandse', 'olandese', 'flemish', 'vlaams']
      IT: ['italian', 'italienisch\w*', 'italien', 'italiaans', 'italiano']
      AR: ['arabic', 'arabisch', 'arabe', 'arabo']
    # Phrases where a language word is not about language skills.
    not_language: 'deutsche (bank|börse|telekom|post|bahn|presse)|french fries|english channel|swiss german (part|region)|german[- ]speaking (part|region|switzerland)'
    required: '\b(fluent|fluency|fluently|proficient|proficiency|business[- ](level|fluent)|native|mother tongue|excellent|very good|strong|good|full professional|must|required|essential|mandatory|necessary|c1|c2)\b|fließend|fliessend|verhandlungssicher|sehr gut|gute|stilsicher|muttersprach|zwingend|erforderlich|vorausgesetzt|courant|couramment|ma[iî]trise|excellent|parfait|bilingue|exig[ée]|indispensable|vloeiend|uitstekend|goede beheersing|perfect|vereist|noodzakelijk|moedertaal|fluente|ottim|madrelingua'

# ---------------------------------------------------------------- viewer: start dates and "Best fit"
# Postings that start (or are ASAP) before this month get a small badge, and can be hidden with a toggle.
early_start_before: '2027-04'

# Best-fit score (0-100), shown as a number and used as the default sort. Each part adds points;
# see README "Best-fit score". Edit the numbers to change what counts most.
fit_score:
  degree: {bachelor_ok: 25, unclear: 15, master_required: 0}
  language: {english: 25, german: 10, french_dutch: 5}     # what the role needs (see README)
  category:
    points: {top: 25, middle: 15, other: 5}
    top: [brand, marketing, commercial, ecommerce_digital]
    middle: [sales, strategy, marketing_analytics]
  start: {from_cutoff_or_unclear: 15, earlier: 0}
  duration: {three_to_six_months: 10, unclear: 6, shorter: 4, longer: 0}
  pay_bonus: [[2000, 5], [1500, 3], [1000, 1]]     # [gross EUR/month at least, extra points]; max score 105

# Pay: amounts are converted to gross EUR per month (annual /12, hourly x hours_per_month).
# Fixed approximate exchange rates (EUR per unit); update now and then.
pay:
  eur_rates: {EUR: 1.0, CHF: 1.06, GBP: 1.17, AED: 0.25}
  hours_per_month: 173

# ---------------------------------------------------------------- viewer: embedded job descriptions
viewer:
  embed_closed_days: 30     # "Copy for Claude" texts are embedded for open postings + postings closed this many days ago
