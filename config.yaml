# ch-intern-finder configuration. All classification rules live here.
# Patterns are Python regular expressions, matched case-insensitively unless
# listed under a *_case_sensitive key. Use single quotes so backslashes survive.

user_agent: "ch-intern-finder/0.1 (personal internship search; contact via repo issues)"
http:
  max_rps_per_host: 2
  timeout: 40
  retries: 2
  workers: 6            # parallel hosts; each host is still rate-limited on its own

# Health check (the "needs attention" issue). Providers listed here are known to refuse the finder,
# so their failures don't reopen the issue every day. Their postings keep their last known state and
# the viewer marks them "not updated since …". Remove a provider once its feeds work again.
health:
  known_blocked_providers:
    - workday           # since 16 Nov 2026 Workday's sites return HTTP 429 to automated clients (Cloudflare bot filter)

# Which countries count as a match. Add e.g. AE or SG under `countries` and list
# them here; nothing else needs to change.
target_countries: [CH, NL, LU, AE, BE, DE, UK, AT, IE]

# A location string naming one of these places never counts through a *city* name
# ("Cambridge (US), Massachusetts", "Charleroi USA", "Durham (Old Oxford), North Carolina").
# Explicit country names still count, so "Zurich, Switzerland; Boston, USA" stays Swiss.
city_match_blockers: ['\b(USA|U\.S\.A?\.?|United States|Canada|Australia)\b', '\((US|USA|CA|AU)\)', '\b(Massachusetts|North Carolina|South Carolina|Pennsylvania|Connecticut|New Hampshire|New Jersey|Wisconsin|Ohio|Kentucky|Illinois|Michigan|Indiana|Maryland|Virginia|Ontario|Quebec|British Columbia|Alberta|New South Wales|Victoria, Australia|Queensland)\b']

countries:
  CH:
    name: Switzerland
    codes: [CH, CHE]   # ISO codes as returned by feeds (Lever, Recruitee, ...)
    suffix_codes: [CH, CHE]   # codes accepted at the END of a free-text location ("Nyon, VD, CH")
    names: [Switzerland, Schweiz, Suisse, Svizzera, Svizra, Swiss, Helvetia]
    # City / town names; matched on word boundaries against every location string.
